<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07050b">
<meta name="color-scheme" content="dark">

<title>Image Session</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ROOT
========================================================= */

:root {
  --bg: #07050b;
  --panel: rgba(17, 11, 25, .82);
  --panel-strong: rgba(13, 8, 20, .94);

  --text: #fbf8ff;
  --muted: rgba(255,255,255,.54);

  --accent: #c77dff;
  --accent-2: #7c5cff;
  --accent-3: #ff5fa2;

  --line: rgba(255,255,255,.12);

  --shadow:
    0 30px 100px rgba(0,0,0,.6),
    0 0 80px rgba(124,92,255,.08);
}

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.is-hidden {
  display: none !important;
}

/* =========================================================
   GLOBAL BACKGROUND
========================================================= */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -5;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(199,125,255,.20),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 75%,
      rgba(255,95,162,.14),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(124,92,255,.13),
      transparent 36%
    ),
    #07050b;
}

/* =========================================================
   LANDING
========================================================= */

#landing-page {
  position: fixed;
  inset: 0;
  z-index: 100;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at center,
      rgba(124,92,255,.08),
      transparent 48%
    ),
    rgba(4,3,7,.18);
}

/* subtle moving light */

#landing-page::before {
  content: "";
  position: absolute;
  width: 55vw;
  height: 55vw;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(199,125,255,.10),
      transparent 65%
    );

  filter: blur(50px);

  animation: ambientPulse 7s ease-in-out infinite;
  pointer-events: none;
}

@keyframes ambientPulse {
  0%,100% {
    opacity: .55;
    transform: translate(-50%,-50%) scale(.92);
  }

  50% {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1.08);
  }
}

/* =========================================================
   SIDE IMAGE RAILS
========================================================= */

.preview-rail {
  position: absolute;
  top: -12%;
  bottom: -12%;

  width: 27vw;
  min-width: 250px;
  max-width: 430px;

  overflow: hidden;

  opacity: .78;

  mask-image:
    linear-gradient(
      to bottom,
      transparent 0%,
      black 12%,
      black 88%,
      transparent 100%
    );

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      transparent 0%,
      black 12%,
      black 88%,
      transparent 100%
    );

  pointer-events: none;
}

.preview-rail.left {
  left: 0;
}

.preview-rail.right {
  right: 0;
}

.preview-track {
  display: flex;
  flex-direction: column;
  gap: 18px;

  width: 100%;

  will-change: transform;
}

/* slow continuous movement */

.preview-rail.left .preview-track {
  animation: railUp 70s linear infinite;
}

.preview-rail.right .preview-track {
  animation: railDown 78s linear infinite;
}

@keyframes railUp {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-50%);
  }
}

@keyframes railDown {
  from {
    transform: translateY(-50%);
  }

  to {
    transform: translateY(0);
  }
}

.preview-card {
  position: relative;

  width: 100%;
  aspect-ratio: 4 / 5;

  overflow: hidden;

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,.10);

  background:
    linear-gradient(
      145deg,
      rgba(35,23,50,.8),
      rgba(10,7,14,.9)
    );

  box-shadow:
    0 18px 60px rgba(0,0,0,.32),
    0 0 40px rgba(124,92,255,.04);

  transform:
    scale(.92)
    rotate(-2deg);

  transition:
    transform .5s ease,
    opacity .5s ease;
}

.preview-rail.right .preview-card {
  transform: scale(.92) rotate(2deg);
}

.preview-card:nth-child(3n) {
  transform: scale(.96) rotate(1deg);
}

.preview-rail.right .preview-card:nth-child(3n) {
  transform: scale(.96) rotate(-1deg);
}

.preview-card::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      transparent 35%,
      rgba(124,92,255,.10)
    );

  pointer-events: none;
}

.preview-card img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  opacity: .78;

  filter:
    saturate(.88)
    brightness(.72);

  transform: scale(1.015);

  transition:
    transform 1s ease,
    filter 1s ease;
}

.preview-card:hover img {
  transform: scale(1.07);
  filter:
    saturate(1)
    brightness(.9);
}

/* =========================================================
   EDGE FADE
========================================================= */

.rail-fade {
  position: absolute;
  inset: 0;
  z-index: 5;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      #07050b 0%,
      transparent 18%,
      transparent 82%,
      #07050b 100%
    );
}

/* =========================================================
   CENTER LANDING
========================================================= */

.landing-center {
  position: absolute;
  inset: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  pointer-events: none;
}

.welcome-card {
  position: relative;

  width: min(590px, 92vw);

  padding: 58px 52px 50px;

  text-align: center;

  border: 1px solid rgba(199,125,255,.22);
  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(30,20,42,.84),
      rgba(10,7,15,.90)
    );

  box-shadow:
    0 35px 120px rgba(0,0,0,.65),
    0 0 100px rgba(124,92,255,.12),
    inset 0 1px 0 rgba(255,255,255,.07);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  pointer-events: auto;

  animation:
    cardEnter .9s cubic-bezier(.2,.8,.2,1) both,
    cardFloat 7s ease-in-out 1s infinite;
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform:
      translateY(25px)
      scale(.96);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }
}

@keyframes cardFloat {
  0%,100% {
    margin-top: 0;
  }

  50% {
    margin-top: -6px;
  }
}

/* card shine */

.welcome-card::before {
  content: "";

  position: absolute;

  top: -1px;
  left: 10%;
  right: 10%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(199,125,255,.85),
      rgba(255,95,162,.7),
      transparent
    );

  filter: blur(.5px);

  animation: topShine 4s ease-in-out infinite;
}

@keyframes topShine {
  0%,100% {
    opacity: .35;
    transform: scaleX(.55);
  }

  50% {
    opacity: 1;
    transform: scaleX(1);
  }
}

/* =========================================================
   BRAND
========================================================= */

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;

  margin-bottom: 18px;

  color: var(--accent);

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .28em;
  text-transform: uppercase;
}

.eyebrow::before,
.eyebrow::after {
  content: "";

  width: 20px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent)
    );
}

.eyebrow::after {
  background:
    linear-gradient(
      90deg,
      var(--accent),
      transparent
    );
}

/* =========================================================
   TITLE
========================================================= */

.welcome-card h1 {
  font-size: clamp(43px, 6vw, 72px);

  line-height: .94;

  letter-spacing: -.065em;

  background:
    linear-gradient(
      110deg,
      #fff 5%,
      #e9d9ff 35%,
      #c77dff 58%,
      #ff8fbd 85%,
      #fff 100%
    );

  background-size: 220% auto;

  -webkit-background-clip: text;
  background-clip: text;

  color: transparent;

  animation: titleShimmer 5s linear infinite;
}

@keyframes titleShimmer {
  from {
    background-position: 200% center;
  }

  to {
    background-position: -20% center;
  }
}

.welcome-card p {
  max-width: 410px;

  margin: 22px auto 30px;

  color: var(--muted);

  font-size: 14px;
  line-height: 1.75;
}

/* =========================================================
   LIVE COUNTER
========================================================= */

.image-counter {
  display: inline-flex;
  align-items: center;
  gap: 9px;

  margin-bottom: 27px;

  padding: 8px 13px;

  border: 1px solid rgba(255,255,255,.09);
  border-radius: 999px;

  background: rgba(255,255,255,.035);

  color: rgba(255,255,255,.66);

  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.counter-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--accent);

  box-shadow:
    0 0 14px rgba(199,125,255,.9);

  animation: dotPulse 1.8s ease-in-out infinite;
}

@keyframes dotPulse {
  0%,100% {
    opacity: .55;
    transform: scale(.8);
  }

  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* =========================================================
   MAIN BUTTON
========================================================= */

.primary-btn {
  position: relative;

  width: 100%;
  min-height: 58px;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;

  background:
    linear-gradient(
      115deg,
      #9e5df1,
      #c77dff 35%,
      #7c5cff 70%,
      #9e5df1
    );

  background-size: 220% 100%;

  color: white;

  font-size: 13px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;

  box-shadow:
    0 15px 45px rgba(124,92,255,.24),
    inset 0 1px 0 rgba(255,255,255,.25);

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background-position .6s ease;
}

.primary-btn span {
  position: relative;
  z-index: 3;
}

/* moving shine */

.primary-btn::before {
  content: "";

  position: absolute;

  top: -80%;
  left: -45%;

  width: 35%;
  height: 260%;

  transform: rotate(22deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.15),
      rgba(255,255,255,.85),
      rgba(255,255,255,.15),
      transparent
    );

  filter: blur(2px);

  animation: buttonShine 3.2s ease-in-out infinite;
}

@keyframes buttonShine {
  0% {
    left: -50%;
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  48% {
    left: 125%;
    opacity: 1;
  }

  50%,100% {
    left: 125%;
    opacity: 0;
  }
}

/* glow */

.primary-btn::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.28),
      transparent 32%
    );

  opacity: 0;

  transition: opacity .25s ease;

  pointer-events: none;
}

.primary-btn:hover {
  transform: translateY(-3px);

  background-position: 100% center;

  box-shadow:
    0 20px 60px rgba(124,92,255,.38),
    0 0 35px rgba(199,125,255,.15),
    inset 0 1px 0 rgba(255,255,255,.3);
}

.primary-btn:hover::after {
  opacity: 1;
}

.primary-btn:active {
  transform: translateY(0) scale(.985);
}

/* =========================================================
   CHANGELOG
========================================================= */

.changelog {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  margin-top: 25px;

  color: rgba(255,255,255,.38);

  font-size: 10px;
}

.changelog strong {
  color: rgba(255,255,255,.62);
}

.changelog-line {
  width: 22px;
  height: 1px;

  background: rgba(255,255,255,.12);
}

/* =========================================================
   CORNER DECORATIONS
========================================================= */

.corner {
  position: absolute;

  width: 38px;
  height: 38px;

  opacity: .45;

  pointer-events: none;
}

.corner::before,
.corner::after {
  content: "";

  position: absolute;

  background: var(--accent);
}

.corner.tl {
  top: 18px;
  left: 18px;
}

.corner.tr {
  top: 18px;
  right: 18px;
  transform: rotate(90deg);
}

.corner.bl {
  bottom: 18px;
  left: 18px;
  transform: rotate(-90deg);
}

.corner.br {
  right: 18px;
  bottom: 18px;
  transform: rotate(180deg);
}

.corner::before {
  width: 38px;
  height: 1px;
  top: 0;
  left: 0;
}

.corner::after {
  width: 1px;
  height: 38px;
  top: 0;
  left: 0;
}

/* =========================================================
   SETTINGS MODAL
========================================================= */

.modal-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: grid;
  place-items: center;

  padding: 24px;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(199,125,255,.16),
      transparent 35%
    ),
    rgba(4,3,7,.92);

  backdrop-filter: blur(18px);
}

.settings-card {
  width: min(100%, 500px);

  padding: 32px;

  border: 1px solid rgba(199,125,255,.22);
  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      rgba(34,24,48,.96),
      rgba(15,11,22,.96)
    );

  box-shadow: var(--shadow);
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  margin-bottom: 26px;
}

.modal-head h2 {
  font-size: 28px;
  letter-spacing: -.04em;
}

.icon-btn {
  width: 38px;
  height: 38px;

  border: 1px solid var(--line);
  border-radius: 50%;

  background: rgba(255,255,255,.04);

  color: var(--text);

  font-size: 24px;

  transition: .2s ease;
}

.icon-btn:hover {
  background: var(--accent-soft);
  border-color: rgba(199,125,255,.4);
}

.settings-list {
  display: grid;
  gap: 0;

  margin-bottom: 22px;
}

.setting-row {
  display: grid;

  grid-template-columns: 1fr auto;

  gap: 20px;

  align-items: center;

  min-height: 70px;

  padding: 12px 0;

  border-bottom: 1px solid rgba(255,255,255,.07);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-row strong,
.setting-row small {
  display: block;
}

.setting-row strong {
  font-size: 13px;
}

.setting-row small {
  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;
}

select {
  min-width: 100px;

  padding: 9px 11px;

  border: 1px solid var(--line);
  border-radius: 10px;

  outline: 0;

  background: #110c18;
  color: var(--text);
}

input[type="range"] {
  width: 140px;
  accent-color: var(--accent);
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--accent);
}

/* =========================================================
   SESSION
========================================================= */

.session,
.viewer {
  width: 100%;
  height: 100%;
}

.viewer {
  position: relative;

  display: grid;
  place-items: center;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at center,
      rgba(199,125,255,.20),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 20% 80%,
      rgba(255,95,162,.14),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 85% 20%,
      rgba(124,92,255,.16),
      transparent 35%
    ),
    #08060d;
}

/* =========================================================
   IMAGE CONTAINER
========================================================= */

.image-wrap {
  position: absolute;
  inset: 0;

  display: grid;
  place-items: center;

  /*
    This is important:
    the available area accounts for the HUD.
  */

  padding:
    76px
    36px
    105px;

  z-index: 1;
}

#main-image {
  display: block;

  /*
    NEVER stretch the source image.
    It will always preserve its natural aspect ratio.
  */

  width: auto;
  height: auto;

  max-width: 100%;
  max-height: 100%;

  object-fit: contain;

  object-position: center;

  border-radius: 12px;

  user-select: none;
  -webkit-user-drag: none;

  box-shadow:
    0 20px 80px rgba(0,0,0,.55),
    0 0 45px rgba(124,92,255,.10);

  transition:
    transform .08s ease-out,
    filter .25s ease,
    opacity .2s ease;
}

#main-image.is-changing {
  opacity: .15;
  transform: scale(.985);
}

/* =========================================================
   IMAGE EFFECTS
========================================================= */

.image-wrap::before {
  content: "";

  position: absolute;

  width: min(70vw,850px);
  height: min(70vh,650px);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(199,125,255,.20),
      rgba(124,92,255,.08) 35%,
      transparent 70%
    );

  filter: blur(50px);

  pointer-events: none;
}

.image-shade {
  position: absolute;
  inset: 0;
  z-index: 3;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 50%,
      rgba(0,0,0,.30) 100%
    );
}

#beat-flash {
  position: absolute;
  inset: 0;
  z-index: 4;

  pointer-events: none;

  background:
    radial-gradient(
      circle at center,
      rgba(199,125,255,.30),
      rgba(255,95,162,.08),
      transparent 70%
    );

  opacity: 0;

  transition: opacity .05s linear;
}

/* =========================================================
   HUD
========================================================= */

.hud {
  position: absolute;

  z-index: 10;

  left: 20px;
  right: 20px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  pointer-events: none;

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.hud > * {
  pointer-events: auto;
}

.top-hud {
  top: 20px;
}

.bottom-hud {
  bottom: 20px;

  align-items: flex-end;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 13px;

  border: 1px solid rgba(199,125,255,.20);
  border-radius: 999px;

  background: rgba(10,7,15,.55);

  backdrop-filter: blur(14px);

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .18em;
}

.brand-mark {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--accent);

  box-shadow:
    0 0 14px rgba(199,125,255,.9);
}

.top-actions,
.controls,
.stats {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-btn,
.ghost-btn {
  border: 1px solid rgba(255,255,255,.13);

  color: var(--text);

  background: rgba(10,7,15,.55);

  backdrop-filter: blur(14px);

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}

.hud-btn {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  font-size: 15px;
}

.hud-btn:hover,
.ghost-btn:hover {
  background: rgba(199,125,255,.16);

  border-color: rgba(199,125,255,.40);

  transform: translateY(-1px);
}

.hud-btn.is-active {
  background:
    linear-gradient(
      135deg,
      rgba(199,125,255,.28),
      rgba(124,92,255,.22)
    );

  border-color: rgba(199,125,255,.40);

  box-shadow:
    0 0 20px rgba(124,92,255,.12);
}

.stats {
  gap: 22px;

  padding: 11px 15px;

  border: 1px solid rgba(199,125,255,.18);
  border-radius: 14px;

  background: rgba(8,6,12,.55);

  backdrop-filter: blur(14px);
}

.stat span {
  display: block;

  margin-bottom: 3px;

  color: var(--muted);

  font-size: 8px;
  font-weight: 700;
  letter-spacing: .16em;
}

.stat strong {
  color: var(--accent);

  font-size: 19px;
  letter-spacing: -.04em;

  text-shadow:
    0 0 18px rgba(199,125,255,.35);
}

.ghost-btn {
  min-width: 74px;
  min-height: 40px;

  padding: 0 15px;

  border-radius: 999px;

  font-size: 11px;
  font-weight: 700;
}

#edge-btn.is-active {
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-2)
    );

  color: #fff;

  border-color: transparent;

  box-shadow:
    0 8px 24px rgba(124,92,255,.25);
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
  position: absolute;

  z-index: 12;

  right: 0;
  bottom: 0;
  left: 0;

  height: 3px;

  transform-origin: left;

  transform: scaleX(0);

  background:
    linear-gradient(
      90deg,
      var(--accent-3),
      var(--accent),
      var(--accent-2)
    );

  box-shadow:
    0 0 15px rgba(199,125,255,.45);
}

/* =========================================================
   CLEAN HUD
========================================================= */

.viewer.clean .hud {
  opacity: .18;
}

.viewer.clean:hover .hud,
.viewer.clean:focus-within .hud {
  opacity: 1;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {
  .preview-rail {
    width: 21vw;
    min-width: 150px;
  }

  .welcome-card {
    width: min(550px, 80vw);
  }
}

@media (max-width: 640px) {

  .preview-rail {
    width: 30vw;
    min-width: 0;

    opacity: .34;
  }

  .preview-card {
    border-radius: 14px;
  }

  .rail-fade {
    background:
      linear-gradient(
        90deg,
        #07050b 0%,
        transparent 30%,
        transparent 70%,
        #07050b 100%
      );
  }

  .landing-center {
    padding: 18px;
  }

  .welcome-card {
    width: 92vw;

    padding:
      42px
      24px
      32px;

    border-radius: 24px;
  }

  .welcome-card h1 {
    font-size: clamp(40px, 12vw, 58px);
  }

  .welcome-card p {
    font-size: 13px;
  }

  .changelog {
    font-size: 9px;
  }

  .settings-card {
    padding: 22px;

    border-radius: 20px;
  }

  .bottom-hud {
    align-items: stretch;

    flex-direction: column;

    gap: 10px;
  }

  .stats,
  .controls {
    width: 100%;
  }

  .stats {
    justify-content: center;
  }

  .controls {
    justify-content: flex-end;
  }

  .image-wrap {
    padding:
      62px
      10px
      100px;
  }

  #main-image {
    max-width: 100%;
    max-height: 100%;

    border-radius: 8px;
  }
}

@media (max-height: 600px) {

  .welcome-card {
    padding-top: 30px;
    padding-bottom: 28px;
  }

  .welcome-card p {
    margin-top: 12px;
    margin-bottom: 16px;
  }

  .image-wrap {
    padding-top: 48px;
    padding-bottom: 78px;
  }

  .top-hud {
    top: 10px;
  }

  .bottom-hud {
    bottom: 10px;
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LANDING PAGE
======================================================= -->

<div id="landing-page">

  <!-- LEFT IMAGE RAIL -->
  <div class="preview-rail left">
    <div class="preview-track" id="left-preview-track"></div>
  </div>

  <!-- RIGHT IMAGE RAIL -->
  <div class="preview-rail right">
    <div class="preview-track" id="right-preview-track"></div>
  </div>

  <div class="rail-fade"></div>

  <!-- CENTER -->
  <div class="landing-center">

    <div class="welcome-card">

      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="eyebrow">GOON FOR ALICE</span>

      <h1>Welcome<br>GOONER</h1>

      <p>
        The best GOONING experience you will ever see.
      </p>

      <div class="image-counter">
        <span class="counter-dot"></span>
        <span id="landing-count">Preparing gallery...</span>
      </div>

      <button
        id="enter-btn"
        class="primary-btn"
        type="button"
      >
        <span>Enter Session</span>
      </button>

      <div class="changelog">
        <span>v2.0</span>
        <span class="changelog-line"></span>
        <strong>Fully rebranded</strong>
        <span class="changelog-line"></span>
        <span>Very Addictive</span>
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     SETTINGS
======================================================= -->

<div
  id="settings-page"
  class="modal-screen is-hidden"
>

  <div class="settings-card">

    <div class="modal-head">

      <div>
        <span class="eyebrow">SETUP</span>
        <h2>Session settings</h2>
      </div>

      <button
        id="close-settings-btn"
        class="icon-btn"
        aria-label="Close settings"
      >
        ×
      </button>

    </div>

    <div class="settings-list">

      <label class="setting-row">

        <span>
          <strong>Censored mode</strong>
          <small>Apply a soft blur to the image.</small>
        </span>

        <input
          type="checkbox"
          id="censor-check"
        >

      </label>


      <label class="setting-row">

        <span>
          <strong>Blur strength</strong>
          <small>
            <output id="pixel-value">10</output> px
          </small>
        </span>

        <input
          type="range"
          id="pixel-slider"
          min="0"
          max="20"
          value="10"
        >

      </label>


      <label class="setting-row">

        <span>
          <strong>Image interval</strong>
          <small>How often the image changes.</small>
        </span>

        <select id="speed-input">
          <option value="1000">1 sec</option>
          <option value="2500">2.5 sec</option>
          <option value="4000">4 sec</option>
          <option value="5000" selected>5 sec</option>
          <option value="7000">7 sec</option>
          <option value="10000">10 sec</option>
        </select>

      </label>


      <label class="setting-row">

        <span>
          <strong>Difficulty</strong>
          <small>Controls the session pace.</small>
        </span>

        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="extreme">Extreme</option>
        </select>

      </label>


      <label class="setting-row">

        <span>
          <strong>Music</strong>
          <small>Background audio.</small>
        </span>

        <input
          type="checkbox"
          id="bg-toggle"
        >

      </label>


      <label class="setting-row">

        <span>
          <strong>Metronome</strong>
          <small>Visual and click feedback.</small>
        </span>

        <input
          type="checkbox"
          id="metro-toggle"
          checked
        >

      </label>

    </div>

    <button
      id="start-session-btn"
      class="primary-btn"
      type="button"
    >
      <span>Start Session!</span>
    </button>

  </div>

</div>


<!-- =======================================================
     SESSION
======================================================= -->

<main
  id="session"
  class="session is-hidden"
>

  <section
    class="viewer clean"
    id="viewer"
  >

    <div class="image-wrap">

      <img
        id="main-image"
        alt="Session image"
      >

    </div>

    <div
      id="beat-flash"
      aria-hidden="true"
    ></div>

    <div
      class="image-shade"
      aria-hidden="true"
    ></div>


    <!-- TOP HUD -->

    <header class="hud top-hud">

      <div class="brand">
        <span class="brand-mark"></span>
        <span>SESSION</span>
      </div>

      <div class="top-actions">

        <button
          id="music-btn"
          class="hud-btn"
          aria-label="Toggle music"
        >
          ♫
        </button>

        <button
          id="metro-btn"
          class="hud-btn is-active"
          aria-label="Toggle metronome"
        >
          ◉
        </button>

        <button
          id="settings-btn"
          class="hud-btn"
          aria-label="Open settings"
        >
          ☰
        </button>

      </div>

    </header>


    <!-- BOTTOM HUD -->

    <div class="hud bottom-hud">

      <div class="stats">

        <div class="stat">
          <span>BPM</span>
          <strong id="bpm-display">000</strong>
        </div>

        <div class="stat">
          <span>STAGE</span>
          <strong id="stage-display">0</strong>
        </div>

      </div>


      <div class="controls">

        <button
          id="edge-btn"
          class="ghost-btn"
        >
          Focus
        </button>

        <button
          id="end-btn"
          class="ghost-btn"
        >
          End
        </button>

      </div>

    </div>


    <div
      id="session-progress"
      class="progress"
    ></div>

  </section>

</main>


<audio
  id="click-sound"
  src="click.mp3"
  preload="auto"
></audio>


<script>
/* =========================================================
   STATE
========================================================= */

const state = {

  images: [],

  imageIndex: -1,

  bpm: 60,

  stage: 0,

  isEdge: false,

  config: {
    censored: false,
    pixel: 10,
    speed: 5000,
    difficulty: "medium"
  },

  audio: {
    bg: new Audio("bg.mp3"),
    click: document.getElementById("click-sound")
  },

  timers: {
    beat: null,
    ramp: null,
    image: null
  }

};


/* =========================================================
   DIFFICULTY
========================================================= */

const diffLevels = {

  easy: {
    start: 50,
    inc: 1
  },

  medium: {
    start: 70,
    inc: 2
  },

  hard: {
    start: 100,
    inc: 4
  },

  extreme: {
    start: 140,
    inc: 7
  }

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);

const viewer =
  $("viewer");

const image =
  $("main-image");


/* =========================================================
   LOAD IMAGES
========================================================= */

async function fetchContent() {

  try {

    const response =
      await fetch("./images.json", {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (!Array.isArray(data.images)) {
      throw new Error(
        "images.json must contain an images array"
      );
    }

    state.images =
      data.images
        .filter(Boolean)
        .slice(0, 20);

    updateLandingGallery();

    if (!state.images.length) {

      $("landing-count").textContent =
        "No images found";

      throw new Error(
        "No images available"
      );
    }

  } catch (error) {

    console.error(
      "Could not load images.json:",
      error
    );

    $("landing-count").textContent =
      "Gallery unavailable";

  }

}


/* =========================================================
   LANDING PREVIEW
========================================================= */

function createPreviewCard(src, index) {

  const card =
    document.createElement("div");

  card.className =
    "preview-card";

  const img =
    document.createElement("img");

  img.loading = "lazy";

  img.decoding = "async";

  img.alt =
    `Preview ${index + 1}`;

  img.src = src;

  /*
    If an image fails, remove the card rather
    than showing a broken-image icon.
  */

  img.onerror = () => {
    card.remove();
  };

  card.appendChild(img);

  return card;

}


function buildRail(track, images) {

  track.innerHTML = "";

  /*
    Duplicate the 20 images so the animation
    loops seamlessly.
  */

  const all =
    [...images, ...images];

  all.forEach((src, index) => {

    track.appendChild(
      createPreviewCard(src, index % images.length)
    );

  });

}


function updateLandingGallery() {

  const count =
    state.images.length;

  $("landing-count").textContent =
    count
      ? `${count} images ready`
      : "Preparing gallery...";

  if (!count) return;

  buildRail(
    $("left-preview-track"),
    state.images
  );

  /*
    Reverse the source order on the right
    for a more natural opposing flow.
  */

  buildRail(
    $("right-preview-track"),
    [...state.images].reverse()
  );

}


/* =========================================================
   LANDING LOAD
========================================================= */

fetchContent();


/* =========================================================
   SETTINGS
========================================================= */

function showSettings() {

  $("landing-page")
    .classList
    .add("is-hidden");

  $("settings-page")
    .classList
    .remove("is-hidden");

}


function showLanding() {

  $("settings-page")
    .classList
    .add("is-hidden");

  $("landing-page")
    .classList
    .remove("is-hidden");

}


/* =========================================================
   BUTTON MOUSE LIGHT
========================================================= */

document
  .querySelectorAll(".primary-btn")
  .forEach(button => {

    button.addEventListener(
      "pointermove",
      event => {

        const rect =
          button.getBoundingClientRect();

        const x =
          ((event.clientX - rect.left) / rect.width) * 100;

        const y =
          ((event.clientY - rect.top) / rect.height) * 100;

        button.style.setProperty(
          "--mx",
          `${x}%`
        );

        button.style.setProperty(
          "--my",
          `${y}%`
        );

      }
    );

  });


/* =========================================================
   IMAGE FILTER
========================================================= */

function applyImageFilter() {

  if (state.isEdge) {

    image.style.filter =
      "grayscale(1) brightness(.62) blur(1px)";

    return;

  }

  if (state.config.censored) {

    image.style.filter =
      `blur(${state.config.pixel}px)`;

  } else {

    image.style.filter =
      "none";

  }

}


/* =========================================================
   IMAGE CYCLE
========================================================= */

function cycleImage() {

  if (!state.images.length) {
    return;
  }

  let next =
    Math.floor(
      Math.random() * state.images.length
    );

  if (
    state.images.length > 1 &&
    next === state.imageIndex
  ) {

    next =
      (next + 1) %
      state.images.length;

  }

  state.imageIndex =
    next;

  image.classList.add(
    "is-changing"
  );

  image.src =
    state.images[next];

  image.onload = () => {

    /*
      Because width and height remain auto
      and max-width/max-height are used,
      the complete image always fits without
      distortion.
    */

    requestAnimationFrame(() => {

      image.classList.remove(
        "is-changing"
      );

    });

  };

  resetProgress();

}


/* =========================================================
   PROGRESS
========================================================= */

function resetProgress() {

  const progress =
    $("session-progress");

  progress.style.transition =
    "none";

  progress.style.transform =
    "scaleX(0)";

  requestAnimationFrame(() => {

    progress.style.transition =
      `transform ${state.config.speed}ms linear`;

    progress.style.transform =
      "scaleX(1)";

  });

}


/* =========================================================
   BEAT
========================================================= */

function runBeat() {

  if (
    !state.isEdge &&
    $("metro-toggle").checked
  ) {

    const click =
      state.audio.click;

    if (click) {

      click.currentTime = 0;

      click.volume = .25;

      click
        .play()
        .catch(() => {});

    }

    $("beat-flash")
      .style
      .opacity = ".09";

    image.style.transform =
      "scale(1.012)";

    setTimeout(() => {

      $("beat-flash")
        .style
        .opacity = "0";

      image.style.transform =
        "scale(1)";

    }, 65);

  }

  $("bpm-display")
    .textContent =
      String(
        Math.floor(state.bpm)
      ).padStart(3, "0");

  clearTimeout(
    state.timers.beat
  );

  state.timers.beat =
    setTimeout(
      runBeat,
      60000 /
      Math.max(state.bpm, 1)
    );

}


/* =========================================================
   START SESSION
========================================================= */

function startSession() {

  state.config.censored =
    $("censor-check").checked;

  state.config.pixel =
    Number(
      $("pixel-slider").value
    );

  state.config.speed =
    Number(
      $("speed-input").value
    );

  state.config.difficulty =
    $("difficulty-select").value;

  const diff =
    diffLevels[
      state.config.difficulty
    ];

  state.bpm =
    diff.start;

  state.stage =
    0;

  state.isEdge =
    false;

  applyImageFilter();

  $("settings-page")
    .classList
    .add("is-hidden");

  $("landing-page")
    .classList
    .add("is-hidden");

  $("session")
    .classList
    .remove("is-hidden");

  $("edge-btn")
    .classList
    .remove("is-active");

  $("stage-display")
    .textContent = "0";


  /* Music */

  if ($("bg-toggle").checked) {

    state.audio.bg.loop =
      true;

    state.audio.bg.volume =
      .28;

    state.audio.bg
      .play()
      .catch(() => {});

  }


  /* Clear old timers */

  clearInterval(
    state.timers.image
  );

  clearInterval(
    state.timers.ramp
  );

  clearTimeout(
    state.timers.beat
  );


  /* Start image */

  if (state.images.length) {

    cycleImage();

    state.timers.image =
      setInterval(
        cycleImage,
        state.config.speed
      );

  }


  /* Start beat */

  runBeat();


  /* BPM ramp */

  state.timers.ramp =
    setInterval(() => {

      if (!state.isEdge) {

        state.bpm +=
          diff.inc;

        state.stage =
          Math.floor(
            (
              state.bpm -
              diff.start
            ) / 15
          );

        $("stage-display")
          .textContent =
            String(state.stage);

      }

    }, 10000);


  viewer.classList.add(
    "clean"
  );

}


/* =========================================================
   MUSIC
========================================================= */

function toggleMusic() {

  const enabled =
    $("bg-toggle").checked;

  $("bg-toggle").checked =
    !enabled;

  if (!enabled) {

    state.audio.bg.loop =
      true;

    state.audio.bg.volume =
      .28;

    state.audio.bg
      .play()
      .catch(() => {});

  } else {

    state.audio.bg.pause();

  }

  $("music-btn")
    .classList
    .toggle(
      "is-active",
      !enabled
    );

}


/* =========================================================
   METRONOME
========================================================= */

function toggleMetronome() {

  $("metro-toggle").checked =
    !$("metro-toggle").checked;

  $("metro-btn")
    .classList
    .toggle(
      "is-active",
      $("metro-toggle").checked
    );

}


/* =========================================================
   FOCUS
========================================================= */

function toggleFocus() {

  state.isEdge =
    !state.isEdge;

  $("edge-btn")
    .classList
    .toggle(
      "is-active",
      state.isEdge
    );

  applyImageFilter();

}


/* =========================================================
   END SESSION
========================================================= */

function endSession() {

  clearInterval(
    state.timers.image
  );

  clearInterval(
    state.timers.ramp
  );

  clearTimeout(
    state.timers.beat
  );

  state.audio.bg.pause();

  state.audio.bg.currentTime =
    0;

  state.isEdge =
    false;

  state.imageIndex =
    -1;

  $("session")
    .classList
    .add("is-hidden");

  $("settings-page")
    .classList
    .add("is-hidden");

  $("landing-page")
    .classList
    .remove("is-hidden");

  $("stage-display")
    .textContent = "0";

  $("bpm-display")
    .textContent = "000";

  $("edge-btn")
    .classList
    .remove("is-active");

}


/* =========================================================
   EVENTS
========================================================= */

$("enter-btn")
  .addEventListener(
    "click",
    showSettings
  );

$("close-settings-btn")
  .addEventListener(
    "click",
    showLanding
  );

$("start-session-btn")
  .addEventListener(
    "click",
    startSession
  );

$("settings-btn")
  .addEventListener(
    "click",
    showSettings
  );

$("music-btn")
  .addEventListener(
    "click",
    toggleMusic
  );

$("metro-btn")
  .addEventListener(
    "click",
    toggleMetronome
  );

$("edge-btn")
  .addEventListener(
    "click",
    toggleFocus
  );

$("end-btn")
  .addEventListener(
    "click",
    endSession
  );


/* =========================================================
   RANGE
========================================================= */

$("pixel-slider")
  .addEventListener(
    "input",
    event => {

      $("pixel-value")
        .textContent =
          event.target.value;

      state.config.pixel =
        Number(
          event.target.value
        );

      applyImageFilter();

    }
  );


$("censor-check")
  .addEventListener(
    "change",
    applyImageFilter
  );


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  event => {

    if (
      event.code === "Space" &&
      !$("session")
        .classList
        .contains("is-hidden")
    ) {

      event.preventDefault();

      cycleImage();

    }


    if (
      event.key.toLowerCase() === "f" &&
      !$("session")
        .classList
        .contains("is-hidden")
    ) {

      toggleFocus();

    }


    if (
      event.key === "Escape" &&
      !$("settings-page")
        .classList
        .contains("is-hidden")
    ) {

      showLanding();

    }

  }
);


/* =========================================================
   HANDLE TAB / WINDOW VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      state.audio.bg
    ) {

      /*
        Don't stop the session,
        but pause background music while
        the browser tab isn't visible.
      */

      if (!$("bg-toggle").checked) {
        state.audio.bg.pause();
      }

    }

  }
);

</script>

</body>
</html>
